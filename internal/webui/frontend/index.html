<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sigil</title>
<style>
  :root {
    --bg: #0e0e18;
    --surface: rgba(255, 255, 255, 0.045);
    --surface-hover: rgba(255, 255, 255, 0.09);
    --border: rgba(255, 255, 255, 0.09);
    --text: #eceaf4;
    --muted: #9a97ad;
    --accent: #7c5cff;
    --accent2: #00d4ff;
    --error: #ff6060;
    --logbg: rgba(0, 0, 0, 0.25);
    --radius: 14px;
  }

  html[data-theme="light"] {
    --bg: #f0eff6;
    --surface: rgba(0, 0, 0, 0.05);
    --surface-hover: rgba(0, 0, 0, 0.08);
    --border: rgba(0, 0, 0, 0.14);
    --text: #1d1c28;
    --muted: #605e73;
    --error: #c92a2a;
    --logbg: rgba(255, 255, 255, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(124, 92, 255, 0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(0, 212, 255, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ---------- title bar ---------- */
  .titlebar {
    --wails-draggable: drag;
    display: flex;
    align-items: center;
    padding: 14px 16px 0;
  }
  .titlebar .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .titlebar .spacer { flex: 1; }
  .winbtn {
    --wails-draggable: no-drag;
    width: 34px; height: 28px;
    display: grid; place-items: center;
    border: none; background: transparent; color: var(--muted);
    border-radius: 8px; cursor: pointer; font-size: 14px;
    transition: background 0.15s, color 0.15s;
  }
  .winbtn:hover { background: var(--surface-hover); color: var(--text); }
  .winbtn.close:hover { background: #e81123; color: #fff; }

  /* ---------- layout ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 14px 20px 20px;
    min-height: 0;
  }

  .subtitle { color: var(--muted); font-size: 12.5px; margin-top: -8px; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .chip:hover { background: var(--surface-hover); transform: translateY(-1px); }
  .chip.active {
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    border-color: transparent;
    font-weight: 600;
  }

  /* ---------- fields ---------- */
  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .field input {
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25);
  }

  /* ---------- toggles ---------- */
  .toggles { display: flex; gap: 20px; }
  .toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .toggle input { display: none; }
  .toggle .track {
    width: 36px; height: 20px;
    border-radius: 999px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .toggle .track::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .track {
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    border-color: transparent;
  }
  .toggle input:checked + .track::after { transform: translateX(16px); background: #fff; }

  /* ---------- buttons ---------- */
  .btn-row { display: flex; gap: 10px; }
  button.action {
    border: none; cursor: pointer;
    border-radius: var(--radius);
    font-size: 14px; font-weight: 700; letter-spacing: 0.6px;
    padding: 13px 20px;
    color: #fff;
    transition: transform 0.1s, box-shadow 0.2s, filter 0.15s;
  }
  button.action:active { transform: scale(0.98); }
  button.play {
    flex: 1;
    background: linear-gradient(90deg, var(--accent), #5a8bff 60%, var(--accent2));
    background-size: 180% 100%;
    box-shadow: 0 4px 24px rgba(124, 92, 255, 0.35);
  }
  button.play:hover { background-position: 80% 0; box-shadow: 0 6px 28px rgba(124, 92, 255, 0.5); }
  button.patch {
    background: var(--surface);
    border: 1px solid var(--border) !important;
    color: var(--text);
  }
  button.patch:hover { background: var(--surface-hover); }
  button.action:disabled { filter: grayscale(0.7) brightness(0.6); cursor: default; transform: none; }

  /* ---------- progress ---------- */
  .progress {
    height: 4px;
    border-radius: 999px;
    background: var(--surface);
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .progress.on { opacity: 1; }
  .progress .bar {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 8px; }
  .tab {
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tab:hover { background: var(--surface-hover); color: var(--text); }
  .tab.active {
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }

  /* ---------- news ---------- */
  .news-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 6px;
  }
  .news-item:hover { background: var(--surface-hover); border-color: var(--border); }
  .news-item .news-img {
    width: 140px;
    border-radius: 8px;
    flex-shrink: 0;
    display: block;
  }
  .news-item .news-body { flex: 1; min-width: 0; }
  .news-item .news-date {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--accent2);
    margin-bottom: 2px;
  }
  .news-item .news-headline {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .news-item .news-text { color: var(--muted); }

  /* ---------- log ---------- */
  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.25);
    background: var(--logbg);
    padding: 10px 12px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--muted);
    user-select: text;
  }
  .log div { white-space: pre-wrap; word-break: break-all; }
  .log div.err { color: var(--error); }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 8px; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(80px);
    background: rgba(30, 16, 20, 0.95);
    border: 1px solid rgba(255, 96, 96, 0.5);
    color: var(--error);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: transform 0.25s, opacity 0.25s;
    max-width: 85%;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---------- settings modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 380px;
    max-width: 92%;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transform: translateY(8px);
    transition: transform 0.2s;
  }
  .overlay.show .modal { transform: none; }
  .modal h2 { font-size: 16px; font-weight: 700; }
  .modal .settings-error { color: var(--error); font-size: 12.5px; min-height: 1em; }
  .modal .settings-footer {
    display: flex;
    align-items: center;
    color: var(--muted);
    font-size: 11.5px;
  }
  .modal .settings-footer a { color: var(--accent2); cursor: pointer; text-decoration: none; }
  .modal .settings-footer a:hover { text-decoration: underline; }
  .modal .settings-footer.disclaimer { line-height: 1.4; opacity: 0.75; }
  .dir-row { display: flex; gap: 8px; }
  .dir-row input { flex: 1; min-width: 0; }
  .theme-switch { display: flex; gap: 8px; }
  .theme-opt {
    flex: 1;
    padding: 8px;
    text-align: center;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .theme-opt.active {
    background: linear-gradient(90deg, var(--accent), #5a8bff);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }

  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="brand">⚡ Sigil</span>
    <span class="spacer"></span>
    <button class="winbtn" title="Settings" onclick="openSettings()">⚙</button>
    <button class="winbtn" onclick="App.Minimize()">–</button>
    <button class="winbtn close" onclick="App.Close()">✕</button>
  </div>

  <main>
    <div class="subtitle">Custom Wizard101 Launcher</div>

    <div class="chips" id="chips"></div>

    <div class="field">
      <label>Username</label>
      <input id="username" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password">
    </div>

    <div class="toggles">
      <label class="toggle">
        <input id="remember" type="checkbox" checked>
        <span class="track"></span>
        Remember me
      </label>
      <label class="toggle">
        <input id="skippatch" type="checkbox">
        <span class="track"></span>
        Skip patch check
      </label>
    </div>

    <div class="btn-row">
      <button class="action play" id="play" onclick="play()">PLAY</button>
      <button class="action patch" id="patch" onclick="patch()">Patch</button>
    </div>

    <div class="progress" id="progress"><div class="bar"></div></div>

    <div class="tabs">
      <button class="tab active" id="tab-news" onclick="showTab('news')">News</button>
      <button class="tab" id="tab-log" onclick="showTab('log')">Log</button>
      <span style="flex:1"></span>
      <button class="tab" onclick="App.OpenNewsWindow()">Full page ↗</button>
    </div>

    <div class="log fade-in" id="news"><div>Loading news…</div></div>
    <div class="log fade-in" id="log" style="display:none"><div>Ready. Pick an account and hit PLAY.</div></div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="settings-overlay" onclick="if (event.target === this) closeSettings()">
    <div class="modal">
      <h2>Settings</h2>
      <div class="field">
        <label>Install directory</label>
        <div class="dir-row">
          <input id="set-installdir" type="text" spellcheck="false">
          <button class="action patch" onclick="browseDir()">Browse…</button>
        </div>
      </div>
      <div class="toggles">
        <label class="toggle">
          <input id="set-minimize" type="checkbox">
          <span class="track"></span>
          Minimize when the game launches
        </label>
      </div>
      <div class="field">
        <label>Theme</label>
        <div class="theme-switch">
          <div class="theme-opt" id="theme-dark" onclick="pickTheme('dark')">🌙 Dark</div>
          <div class="theme-opt" id="theme-light" onclick="pickTheme('light')">☀️ Light</div>
        </div>
      </div>
      <div class="settings-error" id="settings-error"></div>
      <div class="btn-row">
        <button class="action play" onclick="saveSettings()">Save</button>
        <button class="action patch" onclick="closeSettings()">Cancel</button>
      </div>
      <div class="settings-footer">
        <span>Sigil v<span id="version"></span></span>
        <span style="flex:1"></span>
        <a onclick="App.OpenURL('https://github.com/GhostNoodl/sigil')">GitHub ↗</a>
      </div>
      <div class="settings-footer disclaimer">
        Unofficial fan project — not affiliated with KingsIsle Entertainment
        or gamigo group. Wizard101 is a trademark of its respective owner.
      </div>
    </div>
  </div>

<script>
  const App = window.go.webui.App;
  const $ = id => document.getElementById(id);
  let busy = false;

  function renderChips(accounts, active) {
    const box = $("chips");
    box.innerHTML = "";
    for (const name of accounts) {
      const el = document.createElement("button");
      el.className = "chip" + (name === active ? " active" : "");
      el.textContent = name;
      el.onclick = () => selectAccount(name);
      box.appendChild(el);
    }
  }

  async function selectAccount(name) {
    $("username").value = name;
    $("password").value = await App.GetPassword(name);
    refreshActiveChip();
  }

  function refreshActiveChip() {
    const current = $("username").value;
    document.querySelectorAll(".chip").forEach(c =>
      c.classList.toggle("active", c.textContent === current));
  }
  $("username").addEventListener("input", refreshActiveChip);

  function setBusy(b) {
    busy = b;
    $("play").disabled = b;
    $("patch").disabled = b;
    $("progress").classList.toggle("on", b);
    if (b) showTab("log");
  }

  function showTab(which) {
    $("tab-news").classList.toggle("active", which === "news");
    $("tab-log").classList.toggle("active", which === "log");
    $("news").style.display = which === "news" ? "" : "none";
    $("log").style.display = which === "log" ? "" : "none";
  }

  function formatDate(iso) {
    try {
      return new Date(iso + "T00:00:00").toLocaleDateString(undefined, {
        month: "short", day: "numeric", year: "numeric"
      });
    } catch { return iso; }
  }

  async function loadNews() {
    const box = $("news");
    try {
      const items = await App.GetNews();
      box.innerHTML = "";
      for (const item of items) {
        const el = document.createElement("div");
        el.className = "news-item";
        if (item.image) {
          const img = document.createElement("img");
          img.className = "news-img";
          img.src = item.image;
          img.loading = "lazy";
          el.appendChild(img);
        }
        const body = document.createElement("div");
        body.className = "news-body";
        body.innerHTML =
          `<div class="news-date"></div>` +
          `<div class="news-headline"></div>` +
          `<div class="news-text"></div>`;
        body.querySelector(".news-date").textContent = formatDate(item.date);
        body.querySelector(".news-headline").textContent = item.headline;
        body.querySelector(".news-text").textContent = item.text;
        el.appendChild(body);
        el.onclick = () => App.OpenURL(item.url);
        box.appendChild(el);
      }
      box.scrollTop = 0;
    } catch (e) {
      box.innerHTML = "";
      const el = document.createElement("div");
      el.textContent = "Couldn't load news: " + e;
      box.appendChild(el);
    }
  }

  function logLine(msg, isErr) {
    const el = document.createElement("div");
    if (isErr) el.className = "err";
    el.textContent = msg;
    const log = $("log");
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
  }

  function play() {
    if (busy) return;
    App.Play(
      $("username").value,
      $("password").value,
      $("remember").checked,
      $("skippatch").checked
    );
  }

  function patch() {
    if (busy) return;
    App.Patch();
  }

  window.runtime.EventsOn("log", logLine);
  window.runtime.EventsOn("busy", setBusy);
  window.runtime.EventsOn("failed", toast);
  window.runtime.EventsOn("accounts", accounts => renderChips(accounts, $("username").value));

  let currentTheme = "dark";
  let savedTheme = "dark";

  function applyTheme(t) {
    currentTheme = t;
    document.documentElement.dataset.theme = t;
    $("theme-dark").classList.toggle("active", t === "dark");
    $("theme-light").classList.toggle("active", t === "light");
  }

  function pickTheme(t) { applyTheme(t); }

  function openSettings() {
    $("settings-overlay").classList.add("show");
    $("settings-error").textContent = "";
  }

  function closeSettings() {
    // Revert unsaved theme changes.
    applyTheme(savedTheme);
    $("settings-overlay").classList.remove("show");
  }

  async function browseDir() {
    const dir = await App.BrowseInstallDir();
    if (dir) $("set-installdir").value = dir;
  }

  async function saveSettings() {
    const err = await App.SaveSettings(
      $("set-installdir").value,
      currentTheme,
      $("set-minimize").checked
    );
    if (err) {
      $("settings-error").textContent = err;
      return;
    }
    savedTheme = currentTheme;
    $("settings-overlay").classList.remove("show");
  }

  (async () => {
    const state = await App.GetState();
    renderChips(state.accounts, state.defaultAccount);
    if (state.defaultAccount) selectAccount(state.defaultAccount);
    $("remember").checked = state.rememberMe;
    $("skippatch").checked = state.skipPatch;
    $("set-installdir").value = state.installDir;
    $("set-minimize").checked = state.minimizeOnLaunch;
    $("version").textContent = state.version;
    savedTheme = state.theme;
    applyTheme(state.theme);
    loadNews();
  })();
</script>
</body>
</html>
